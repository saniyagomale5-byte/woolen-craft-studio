<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css')}}">

</head>
<body>

<h2>Edit Profile</h2>

<form method="POST">

    <label>Full Name</label><br>
    <input type="text" name="fullname" value="{{ user.fullname }}"><br><br>

    <label>Email</label><br>
    <input type="email" name="email" value="{{ user.email }}"><br><br>

    <label>Phone</label><br>
    <input type="text" name="phone" value="{{ user.phone }}"><br><br>

    <button type="submit">Save Changes</button>

</form>

<br>

<a href="{{ url_for('profile') }}">Back to Profile</a>

</body>
</html>
