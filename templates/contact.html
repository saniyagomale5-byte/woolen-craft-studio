<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="contact-container">

    <div class="contact-left">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Feel free to contact us anytime.</p>

        <div class="info">
            <p><i class="fa-solid fa-location-dot"></i> Mumbai, Maharashtra, India</p>
            <p><i class="fa-solid fa-phone"></i> +91 9876543210</p>
            <p><i class="fa-solid fa-envelope"></i> woolencraft@gmail.com</p>
        </div>
    </div>

    <div class="contact-right">
        <form>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Subject" required>
            <textarea rows="5" placeholder="Your Message"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

</div>
<script src="contact.js"></script>

</body>
</html>
