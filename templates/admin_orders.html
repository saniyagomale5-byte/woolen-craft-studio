<!DOCTYPE html>
<html>
<head>
    <title>Admin Orders</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_orders.css') }}">
</head>
<body>

<h1>📦 All Customer Orders</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Customer ID</th>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.user_id }}</td>
        <td>{{ order.product_name }}</td>
        <td>₹{{ order.price }}</td>
        <td>{{ order.quantity }}</td>
        <td>{{ order.status }}</td>

        <td>
            <a href="/update-status/{{ order.id }}/Pending">
              <button>Pending</button>
            </a>

            <a href="/update-status/{{ order.id }}/Shipped">
              <button>Shipped</button>
            </a>

            <a href="/update-status/{{ order.id }}/Delivered">
              <button>Delivered</button>
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>

<div class="back">
    <a href="{{ url_for('admin') }}">
        <button>⬅ Back to Admin</button>
    </a>
</div>

</body>
</html>
