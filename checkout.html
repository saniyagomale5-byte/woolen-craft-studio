<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Woolen Craft Studio</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
</head>
<body>

<div class="checkout-container">

    <!-- Billing Details -->
    <div class="billing">

        <h2>Billing Details</h2>

        <form method="POST" action="{{ url_for('checkout') }}">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="text"
                name="phone"
                placeholder="Phone Number"
                required>

            <textarea
                name="address"
                rows="4"
                placeholder="Full Address"
                required></textarea>

            <input
                type="text"
                name="city"
                placeholder="City"
                required>

            <input
                type="text"
                name="state"
                placeholder="State"
                required>

            <input
                type="text"
                name="pincode"
                placeholder="Pincode"
                required>

            <select name="payment" required>
                <option value="">Select Payment Method</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="UPI">UPI</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
            </select>

            <button type="submit" class="place-btn">
                Place Order
            </button>

        </form>

    </div>

    <!-- Order Summary -->
    <div class="order-summary">

        <h2>Order Summary</h2>

        <div class="item">
            <span>Rainbow Wall Hanging</span>
            <span>₹499</span>
        </div>

        <div class="item">
            <span>Macrame Basket</span>
            <span>₹799</span>
        </div>

        <hr>

        <div class="item">
            <strong>Total</strong>
            <strong>₹1298</strong>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/checkout.js') }}"></script>

</body>
</html>
