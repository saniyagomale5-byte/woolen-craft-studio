<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Woolen Craft Studio</title>
    <link rel="stylesheet" href="cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <h2>🧶 Woolen Craft Studio</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="signin.html">Sign In</a>
    </nav>
</header>

<section class="cart-container">

    <h1>Your Shopping Cart</h1>

    <div class="cart-item">

        <img src="images/il_1080xN.2818781025_h71p.webp" alt="Rainbow Wall Hanging">

        <div class="details">
            <h3>Rainbow Wall Hanging</h3>
            <p>Price: ₹799</p>

            <label>Quantity:</label>
            <input type="number" value="1" min="1">
        </div>

        <h2>₹799</h2>

    </div>

    <div class="cart-item">

        <img src="images/OPAC.jpg" alt="Macrame Basket">

        <div class="details">
            <h3>Macrame Basket</h3>
            <p>Price: ₹999</p>

            <label>Quantity:</label>
            <input type="number" value="1" min="1">
        </div>

        <h2>₹999</h2>

    </div>

    <div class="summary">

        <h2>Order Summary</h2>

        <p>Subtotal : <span>₹1798</span></p>
        <p>Shipping : <span>Free</span></p>

        <hr>

        <h3>Total : ₹1798</h3>

        <button>Proceed to Checkout</button>

    </div>

</section>
<script src="cart.js"></script>

</body>
</html>
