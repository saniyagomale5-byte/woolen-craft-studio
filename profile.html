<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="profile-container">

<div class="profile-card">

<img src="images/profile.jpg" alt="Profile">

<h2>Saniya Gomale</h2>

<p>Customer</p>

<button>Edit Profile</button>

</div>

<div class="profile-details">

<h1>My Profile</h1>

<div class="info">

<div class="box">
<label>Full Name</label>
<input type="text" value="Saniya Gomale">
</div>

<div class="box">
<label>Email</label>
<input type="email" value="saniya@gmail.com">
</div>

<div class="box">
<label>Phone</label>
<input type="text" value="+91 9876543210">
</div>

<div class="box">
<label>Address</label>
<textarea>Mumbai, Maharashtra</textarea>
</div>

</div>
<img id="profileImage" src="images/profile.jpg" alt="Profile">

<input type="file" id="imageInput">

<input class="profile-input" type="text" value="Saniya Gomale" readonly>

<input class="profile-input" type="email" value="saniya@gmail.com" readonly>

<input class="profile-input" type="text" value="9876543210" readonly>

<button id="editBtn">Edit Profile</button>

<button id="saveBtn">Save Changes</button>

<button id="logoutBtn">Logout</button>

<script src="profile.js"></script>

<div class="buttons">

<button class="save">
Save Changes
</button>

<button class="logout">
Logout
</button>

</div>

</div>

</div>

<button id="logoutBtn">Logout</button>

<script src="profile.js"></script>

</body>
</html>
